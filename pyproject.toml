[project]
name = "localbrain"
version = "0.1.0"
description = "个人本地知识库 + Agent 问答"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "docling>=2.30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jieba>=0.42.1",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "modelscope>=1.40.2",
    "ocrmac>=1.0 ; sys_platform == 'darwin'",
    "odfdo>=3.22,<4",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.4",
    "uvicorn[standard]>=0.30",
    "watchfiles>=0.24",
]

# 国内 PyPI 镜像，Windows 开发机和 Mac mini 都适用
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[project.scripts]
localbrain = "localbrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localbrain"]
